[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "settlement-reconciliation-agent"
version = "0.1.0"
description = "Deterministic Razorpay settlement reconciliation with evidence-grounded AI explanations"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.19.1",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "psycopg[binary]==3.3.4",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "hypothesis==6.165.10",
  "mypy==1.20.2",
  "pytest==8.4.2",
  "pytest-cov==6.3.0",
  "ruff==0.16.4",
]

[project.scripts]
recon-demo = "recon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/recon", "apps/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/recon", "apps/api"]
